name: Evaluación de seguridad de dependencias

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-assessment:
    name: Evaluar escenarios S0–S10
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Node.js for npm integrity verification
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Cosign for non-npm artifact bundles
        uses: sigstore/cosign-installer@v4.0.0
        with:
          cosign-release: v3.0.2

      - name: Record dependency verification tool versions
        run: |
          set -euo pipefail
          mkdir -p reports
          node --version > reports/node-version.txt
          npm --version > reports/npm-version.txt
          cosign version > reports/cosign-version.txt

      - name: Scan committed scenario files with Trivy
        run: |
          set -euo pipefail
          mkdir -p reports
          mkdir -p "${RUNNER_TEMP}/trivy-cache"

          trivy_image="aquasec/trivy:0.76.2"

          docker run --rm \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            "${trivy_image}" --version > reports/trivy-version.txt

          for project in esenario/s*; do
            [ -d "${project}" ] || continue
            scenario="$(basename "${project}")"
            scenario_path="/workspace/${project}"
            skip_args=()
            if [ -d "${project}/node_modules" ]; then
              skip_args=(--skip-dirs "${scenario_path}/node_modules")
            fi

            docker run --rm \
              --volume "${GITHUB_WORKSPACE}:/workspace" \
              --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
              "${trivy_image}" \
              fs \
              --scanners vuln,license \
              "${skip_args[@]}" \
              --format json \
              --output "/workspace/reports/trivy-${scenario}.json" \
              --exit-code 0 \
              "${scenario_path}"
          done

          if [ -f "${RUNNER_TEMP}/trivy-cache/db/metadata.json" ]; then
            cp "${RUNNER_TEMP}/trivy-cache/db/metadata.json" reports/trivy-db-metadata.json
          else
            printf '{"status":"metadata file not found in Trivy cache"}\n' \
              > reports/trivy-db-metadata.json
          fi

      - name: Verify npm dependency installation and registry signatures
        run: |
          set -euo pipefail
          for project in esenario/s*; do
            [ -d "${project}" ] || continue
            scenario="$(basename "${project}")"
            python3 scripts/verify_npm_dependencies.py \
              --project "${project}" \
              --policy config/dependency-policy.json \
              --output "reports/npm-integrity-${scenario}.json"
          done

      - name: Verify direct RubyGems and Maven artifact integrity
        run: |
          set -euo pipefail
          for project in esenario/s*; do
            [ -d "${project}" ] || continue
            scenario="$(basename "${project}")"
            python3 scripts/verify_non_npm_dependencies.py \
              --project "${project}" \
              --policy config/dependency-policy.json \
              --output "reports/non-npm-integrity-${scenario}.json"
          done

      - name: Verify Sigstore bundles for non-npm artifacts
        run: |
          set -euo pipefail
          for project in esenario/s*; do
            [ -d "${project}" ] || continue
            scenario="$(basename "${project}")"
            python3 scripts/verify_sigstore_artifacts.py \
              --project "${project}" \
              --policy config/dependency-policy.json \
              --output "reports/sigstore-${scenario}.json"
          done

      - name: Scan Compose images with Trivy and run container tests
        run: |
          set -euo pipefail
          trivy_image="aquasec/trivy:0.76.2"
          for project in esenario/s*; do
            [ -d "${project}" ] || continue
            scenario="$(basename "${project}")"
            python3 scripts/run_compose_scenario.py \
              --project "${project}" \
              --workspace "${GITHUB_WORKSPACE}" \
              --reports-dir "${GITHUB_WORKSPACE}/reports" \
              --trivy-cache "${RUNNER_TEMP}/trivy-cache" \
              --trivy-image "${trivy_image}" \
              --output "reports/compose-${scenario}.json"
          done

      - name: Evaluate static controls and consolidate decision
        run: |
          set -euo pipefail
          for project in esenario/s*; do
            [ -d "${project}" ] || continue
            scenario="$(basename "${project}")"
            python3 scripts/assess_dependencies.py \
              --project "${project}" \
              --policy config/dependency-policy.json \
              --trivy-report "reports/trivy-${scenario}.json" \
              --npm-integrity-report "reports/npm-integrity-${scenario}.json" \
              --non-npm-integrity-report "reports/non-npm-integrity-${scenario}.json" \
              --sigstore-report "reports/sigstore-${scenario}.json" \
              --compose-report "reports/compose-${scenario}.json" \
              --output "reports/assessment-${scenario}.json"
          done

      - name: Render scenario summary
        run: |
          set -euo pipefail
          python3 scripts/render_assessment_summary.py reports/assessment-s*.json \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload assessment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-assessment-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Save assessment evidence to evidencias branch
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          set -euo pipefail

          if [ ! -d reports ] || ! find reports -type f -print -quit 2>/dev/null | grep -q .; then
            echo "No hay archivos de evidencia para guardar."
            exit 0
          fi

          run_path="runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          upload_dir="${RUNNER_TEMP}/evidence-upload/${run_path}"
          evidence_worktree="${RUNNER_TEMP}/evidencias-branch"
          mkdir -p "${upload_dir}"
          cp -a reports "${upload_dir}/reports"

          if git fetch --depth=1 origin +refs/heads/evidencias:refs/remotes/origin/evidencias; then
            git worktree add --detach "${evidence_worktree}" refs/remotes/origin/evidencias
          else
            git worktree add --orphan -b evidencias "${evidence_worktree}"
          fi

          git -C "${evidence_worktree}" config user.name "github-actions[bot]"
          git -C "${evidence_worktree}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          copy_evidence() {
            if git -C "${evidence_worktree}" ls-tree -r --name-only HEAD -- "${run_path}" 2>/dev/null | grep -q .; then
              echo "::error::Ya existe evidencia para ${run_path}; no se sobrescribirá."
              return 1
            fi

            rm -rf "${evidence_worktree}/${run_path}"
            mkdir -p "${evidence_worktree}/${run_path}"
            cp -a "${upload_dir}/reports" "${evidence_worktree}/${run_path}/reports"
            git -C "${evidence_worktree}" add -- "${run_path}"
            git -C "${evidence_worktree}" commit -m "Save evidence for run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
          }

          copy_evidence

          for attempt in 1 2 3 4 5; do
            if git -C "${evidence_worktree}" push origin HEAD:refs/heads/evidencias; then
              echo "Evidencia guardada en ${run_path}."
              exit 0
            fi

            if [ "${attempt}" -eq 5 ]; then
              break
            fi

            git fetch --depth=1 origin +refs/heads/evidencias:refs/remotes/origin/evidencias
            git -C "${evidence_worktree}" reset --hard refs/remotes/origin/evidencias

            if git -C "${evidence_worktree}" ls-tree -r --name-only HEAD -- "${run_path}" 2>/dev/null | grep -q .; then
              echo "La evidencia ${run_path} ya quedó guardada por un intento concurrente."
              exit 0
            fi

            copy_evidence
          done

          echo "::error::No se pudo publicar la evidencia después de varios intentos."
          exit 1
