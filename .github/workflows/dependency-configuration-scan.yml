name: Dependency Configuration and Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: projects
        shell: bash
        run: |
          projects="$(find esenario -mindepth 2 -maxdepth 2 -type f \
            \( -name package.json -o -name pom.xml -o -name Gemfile \) \
            -printf '%h\n' | sort -u | jq -Rsc 'split("\n") | map(select(length > 0))')"
          test "$projects" != '[]'
          echo "matrix=$projects" >> "$GITHUB_OUTPUT"

  scan:
    name: Configuration and secret analysis — ${{ matrix.project }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4
      - name: Scan configuration and secrets with Trivy
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.project }}
          scanners: misconfig,secret
          format: table
          exit-code: '1'
